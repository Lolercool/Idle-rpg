<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idle RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="game-container">
    
    <!-- Top Header -->
    <header class="game-header">
      <h1>My Idle RPG</h1>
      <p>Coins: <span id="coin-text">0</span></p>
      <p>Level: <span id="level-text">0</span></p>
      <p>Xp: <span id="xp-text">0</span></p>
    </header>

    <!-- Left Sidebar -->
    <aside class="game-sidebar">
      <h2>Activities</h2>
      <div class="button-container">
        <button class="nav-btn">Woodcutting</button>
        <button class="nav-btn">Mining</button>
        <button class="nav-btn">Combat</button>
      </div>
    </aside>

    <!-- Main Gameplay Screen -->
    <main class="game-main">
      <h2>Main View</h2>
      <p>Select an activity from the left to begin.</p>
    </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
